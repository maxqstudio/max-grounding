name: Bootstrap governance

on:
  push:
    branches:
      - work/phase-00-governance

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bootstrap source tests
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m compileall -q src tests .workflow/tools
      - name: Generate actual sequence evidence
        run: |
          python .workflow/tools/generate_sequence_actual.py \
            --output-json docs/sequence/generated/phase-00-bootstrap.actual.json \
            --output-mermaid docs/sequence/generated/phase-00-bootstrap.actual.mmd \
            --entry src/max_grounding/__init__.py::project_identity
      - name: Generate governed docs
        run: python .workflow/tools/sync_project_truth.py
      - name: Commit deterministic generated baseline
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow/acceptance.json .workflow/generated docs
          git commit -m "docs: generate phase 0 project truth"
          git push
