name: Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cross-platform:
    name: Core ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Unit and smoke tests
        run: python -m unittest discover -s tests -v
      - name: Compile tracked Python
        run: python -m compileall -q src tests .workflow/tools
      - name: Runtime identity
        run: python -c "from max_grounding import project_identity; x=project_identity(); assert x['cross_platform'] is True; print(x)"

  governance:
    name: STRICT governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify generated documentation is synchronized
        run: |
          python .workflow/tools/sync_project_truth.py
          git diff --exit-code
      - name: Validate governance
        run: |
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_sequence_sessions.py
          BASE=$(python -c "import json; print(json.load(open('.workflow/state.json', encoding='utf-8'))['last_accepted_sha'])")
          python .workflow/tools/validate_cross_document_consistency.py --base "$BASE" --require-base
          python .workflow/tools/validate_project_truth.py
      - name: Require clean candidate worktree
        run: test -z "$(git status --porcelain)"
      - name: Checkout pinned Skill Workflow authority
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: maxqstudio/Skill_Workflow
          ref: 9e22feddb8f94e8c0f1af6a33e14b64de5068f8f
          path: .skill-workflow-authority
          persist-credentials: false
      - name: Self-test pinned STRICT workflow authority
        run: python .skill-workflow-authority/scripts/selftest_strict_project_workflow.py
