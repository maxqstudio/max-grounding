name: Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cross-platform:
    name: Service ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install '.[service,test]'
      - name: Unit and smoke tests
        run: python -m unittest discover -s tests -v
      - name: Compile tracked Python
        run: python -m compileall -q src tests integration .workflow/tools
      - name: Runtime identity
        run: python -c "from max_grounding import project_identity; x=project_identity(); assert x['cross_platform'] is True; print(x)"

  governance:
    name: STRICT governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify generated documentation is synchronized
        run: |
          python .workflow/tools/sync_project_truth.py
          git diff --exit-code
      - name: Validate governance
        run: |
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_sequence_sessions.py
          BASE=$(python -c "import json; print(json.load(open('.workflow/state.json', encoding='utf-8'))['last_accepted_sha'])")
          python .workflow/tools/validate_cross_document_consistency.py --base "$BASE" --require-base

      - name: Diagnose stale CURRENT sequence artifacts without weakening acceptance
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          generator = Path(".workflow/tools/generate_sequence_actual.py")
          for session_path in sorted(Path("docs/sequence/sessions").glob("*.json")):
              session = json.loads(session_path.read_text(encoding="utf-8"))
              if session.get("scope") != "CURRENT":
                  continue
              actual = session["actual"]
              arguments = [
                  sys.executable, str(generator), "--root", ".",
                  "--output-json", actual["graph"],
                  "--output-mermaid", actual["diagram"],
              ]
              for entry in actual.get("entries", []):
                  arguments.extend(("--entry", entry))
              subprocess.run(arguments, check=True)
              graph = json.loads(Path(actual["graph"]).read_text(encoding="utf-8"))
              actual["source_digest"] = graph["source_digest"]
              session_path.write_text(
                  json.dumps(session, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
                  newline="\n",
              )
              print("CURRENT_SEQUENCE_REGENERATED=" + session["session_id"])
          PY
          git diff -- docs/sequence/generated docs/sequence/sessions
          python .workflow/tools/validate_project_truth.py
      - name: Require clean candidate worktree
        run: test -z "$(git status --porcelain)"
      - name: Checkout pinned Skill Workflow authority
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: maxqstudio/Skill_Workflow
          ref: 024e2ea458b25ad9dfb401d3fdeaa994a4cbe1b8
          path: .skill-workflow-authority
          persist-credentials: false
      - name: Self-test pinned STRICT workflow authority
        run: python .skill-workflow-authority/scripts/selftest_strict_project_workflow.py
