name: Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cross-platform:
    name: Core ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Unit and smoke tests
        run: python -m unittest discover -s tests -v
      - name: Compile tracked Python
        run: python -m compileall -q src tests .workflow/tools
      - name: Runtime identity
        run: python -c "from max_grounding import project_identity; x=project_identity(); assert x['cross_platform'] is True; print(x)"

  governance:
    name: STRICT governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Regenerate actual sequence evidence
        run: |
          python .workflow/tools/generate_sequence_actual.py \
            --output-json docs/sequence/generated/phase-00-bootstrap.actual.json \
            --output-mermaid docs/sequence/generated/phase-00-bootstrap.actual.mmd \
            --entry src/max_grounding/__init__.py::project_identity
      - name: Verify generated documentation is synchronized
        run: |
          python .workflow/tools/sync_project_truth.py
          git diff --exit-code
      - name: Validate governance
        run: |
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_cross_document_consistency.py --base 2669e624f86e688f1f709dbf31a4cb198688f85f --require-base
          python .workflow/tools/validate_project_truth.py
      - name: Self-test vendored STRICT workflow
        run: python .workflow/tools/selftest_strict_project_workflow.py
      - name: Require clean final worktree
        run: test -z "$(git status --porcelain)"
