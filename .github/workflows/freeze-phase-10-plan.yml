name: Freeze Phase 10 Plan

on:
  push:
    branches:
      - work/phase-10-claim-verification

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-10-claim-verification
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Render frozen plan
        run: >
          python .workflow/tools/generate_sequence_plan.py
          --plan docs/sequence/plans/phase-10-claim-verification.plan.json
          --output docs/sequence/generated/phase-10-claim-verification.plan.mmd
      - name: Generate planning docs
        run: python .workflow/tools/generate_project_docs.py
      - name: Commit frozen plan artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs .workflow/generated
          if git diff --cached --quiet; then
            echo 'No generated plan changes.'
          else
            git commit -m 'docs: freeze phase 10 plan artifacts'
          fi
      - name: Bind frozen authority
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          plan_path = Path("docs/sequence/plans/phase-10-claim-verification.plan.json")
          session_path = Path("docs/sequence/sessions/phase-10-claim-verification.json")
          frozen = subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()
          session = json.loads(session_path.read_text(encoding="utf-8"))
          session["status"] = "FROZEN"
          session["implementation_base_sha"] = frozen
          session["plan"]["frozen_commit"] = frozen
          session["plan"]["sha256"] = hashlib.sha256(plan_path.read_bytes()).hexdigest()
          session_path.write_text(json.dumps(session, indent=2) + "\n", encoding="utf-8")
          PY
          git add docs/sequence/sessions/phase-10-claim-verification.json
          git commit -m 'plan: bind phase 10 frozen authority'
      - name: Push frozen planning lineage
        run: git push origin HEAD:work/phase-10-claim-verification
