name: Freeze Phase 4 Plan

on:
  push:
    branches:
      - work/phase-04-lexical-retrieval

permissions:
  contents: write

jobs:
  freeze-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-04-lexical-retrieval
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Render frozen plan
        run: >
          python .workflow/tools/generate_sequence_plan.py
          --plan docs/sequence/plans/phase-04-lexical-retrieval.plan.json
          --output docs/sequence/generated/phase-04-lexical-retrieval.plan.mmd
      - name: Generate planning documentation
        run: python .workflow/tools/generate_project_docs.py
      - name: Commit generated plan artifacts
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'Plan artifacts already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs .workflow/generated
          git commit -m 'docs: freeze phase 4 plan artifacts'
          git push origin HEAD:work/phase-04-lexical-retrieval
