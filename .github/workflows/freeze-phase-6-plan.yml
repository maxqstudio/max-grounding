name: Freeze Phase 6 Plan

on:
  push:
    branches:
      - work/phase-06-hybrid-fusion

permissions:
  contents: write

jobs:
  freeze-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-06-hybrid-fusion
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Render frozen plan
        run: >
          python .workflow/tools/generate_sequence_plan.py
          --plan docs/sequence/plans/phase-06-hybrid-fusion.plan.json
          --output docs/sequence/generated/phase-06-hybrid-fusion.plan.mmd
      - name: Generate planning docs
        run: python .workflow/tools/generate_project_docs.py
      - name: Commit generated plan artifacts
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .workflow/generated
          git commit -m "docs: freeze phase 6 plan artifacts"
          git push origin HEAD:work/phase-06-hybrid-fusion
