name: Phase 2 TDD RED

on:
  push:
    branches:
      - work/phase-02-searxng-provider

permissions:
  contents: read

jobs:
  red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install candidate
        run: python -m pip install .
      - name: Prove Phase 2 tests are RED before implementation
        run: python -m unittest tests/test_network_policy.py tests/test_searxng_provider.py -v
