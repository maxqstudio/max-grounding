name: Phase 2 Truth Sync

on:
  push:
    branches:
      - work/phase-02-searxng-provider

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact phase branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-02-searxng-provider
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install candidate
        run: python -m pip install .
      - name: Generate actual Phase 2 sequence
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --output-json docs/sequence/generated/phase-02-searxng-provider.actual.json
          --output-mermaid docs/sequence/generated/phase-02-searxng-provider.actual.mmd
          --entry src/max_grounding/providers/searxng.py::SearxngProvider.search
      - name: Synchronize deterministic project truth
        run: python .workflow/tools/sync_project_truth.py
      - name: Validate generated sequence before commit
        run: python .workflow/tools/validate_sequence_sessions.py
      - name: Re-run source tests
        run: python -m unittest discover -s tests -v
      - name: Commit generated truth artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Truth artifacts already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow/acceptance.json .workflow/generated docs
          git commit -m "docs: sync Phase 2 project truth"
          git push origin HEAD:work/phase-02-searxng-provider
