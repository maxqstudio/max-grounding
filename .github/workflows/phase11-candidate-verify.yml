name: Phase 11 Candidate Verify

on:
  push:
    branches:
      - work/phase-11-concrete-runtime-index

permissions:
  contents: read

jobs:
  sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-11-concrete-runtime-index
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests integration .workflow/tools
      - name: Generate persistent-index ACTUAL
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --output-json docs/sequence/generated/phase-11-persistent-index.actual.json
          --output-mermaid docs/sequence/generated/phase-11-persistent-index.actual.mmd
          --entry src/max_grounding/persistent.py::index_documents
      - name: Generate persistent-query ACTUAL
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --output-json docs/sequence/generated/phase-11-persistent-query.actual.json
          --output-mermaid docs/sequence/generated/phase-11-persistent-query.actual.mmd
          --entry src/max_grounding/persistent.py::retrieve_persistent_semantic
      - name: Validate frozen persistent-index plan
        run: >
          python .workflow/tools/validate_sequence_contract.py
          --session docs/sequence/sessions/phase-11-persistent-index.json
      - name: Validate frozen persistent-query plan
        run: >
          python .workflow/tools/validate_sequence_contract.py
          --session docs/sequence/sessions/phase-11-persistent-query.json

  cross-platform:
    name: Core ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-11-concrete-runtime-index
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests integration .workflow/tools
