name: Phase 11 Closure Finalize

on:
  push:
    branches:
      - work/phase-11-closure

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-11-closure
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Source regression
        shell: bash
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m compileall -q src tests integration .workflow/tools

      - name: Remove temporary workflow before truth generation
        run: rm -f .github/workflows/phase11-closure-finalize.yml

      - name: Synchronize Project Truth
        run: python .workflow/tools/sync_project_truth.py

      - name: Verify closure state
        shell: bash
        run: |
          grep -q '"current_phase": "PHASE_12_PRODUCTION_API_MCP"' .workflow/roadmap.json
          grep -q 'Current roadmap phase: PHASE_12_PRODUCTION_API_MCP' docs/ROADMAP.md
          grep -q 'ROADMAP_SYNC: PASS' docs/ROADMAP.md
          grep -q '"scope": "HISTORICAL"' docs/sequence/sessions/phase-11-persistent-index.json
          grep -q '"scope": "HISTORICAL"' docs/sequence/sessions/phase-11-persistent-query.json

      - name: Commit deterministic closure snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow docs README.md .github/workflows
          git commit -m 'docs: finalize phase 11 closure truth'

      - name: Validate final clean STRICT snapshot
        shell: bash
        run: |
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_cross_document_consistency.py --base 1b193080922fc95a7955123e0d4c6c950f83c081 --require-base
          python .workflow/tools/validate_project_truth.py
          git diff --exit-code 1b193080922fc95a7955123e0d4c6c950f83c081..HEAD -- src tests integration
          test -z "$(git status --porcelain)"

      - name: Push validated closure
        run: git push origin HEAD:work/phase-11-closure
