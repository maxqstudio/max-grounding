name: Phase 11 Closure Sync V2

on:
  push:
    branches:
      - work/phase-11-closure

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-11-closure
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Source regression
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m compileall -q src tests integration .workflow/tools
      - name: Apply closure semantics
        run: python .github/phase11_closure_sync.py
      - name: Remove temporary automation
        run: |
          rm -f .github/phase11_closure_sync.py
          rm -f .github/workflows/phase11-closure-sync-v2.yml
      - name: Synchronize closure truth
        run: python .workflow/tools/sync_project_truth.py
      - name: Verify roadmap remains Phase 11
        run: |
          grep -q 'Current roadmap phase: PHASE_11_CONCRETE_RUNTIME_INDEX' docs/ROADMAP.md
          grep -q 'ROADMAP_SYNC: PASS' docs/ROADMAP.md
      - name: Commit closure snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow docs README.md .github
          git commit -m 'docs: sync phase 11 closure state'
      - name: Validate clean STRICT closure
        run: |
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_cross_document_consistency.py --base 1b193080922fc95a7955123e0d4c6c950f83c081 --require-base
          python .workflow/tools/validate_project_truth.py
          git diff --exit-code 1b193080922fc95a7955123e0d4c6c950f83c081..HEAD -- src tests integration
          test -z "$(git status --porcelain)"
      - name: Push
        run: git push origin HEAD:work/phase-11-closure
