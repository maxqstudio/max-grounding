name: Phase 11 Real Services

on:
  push:
    branches:
      - work/phase-11-concrete-runtime-index

permissions:
  contents: read

jobs:
  real-services:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-11-concrete-runtime-index

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install MAX Grounding
        run: python -m pip install .

      - name: Pull pinned service images
        shell: bash
        run: |
          docker pull qdrant/qdrant:v1.19.1
          docker pull ollama/ollama:0.34.0
          docker image inspect qdrant/qdrant:v1.19.1 --format 'QDRANT_IMAGE={{.Id}}'
          docker image inspect ollama/ollama:0.34.0 --format 'OLLAMA_IMAGE={{.Id}}'

      - name: Start pinned Qdrant and Ollama
        shell: bash
        run: |
          docker volume create phase11_qdrant
          docker volume create phase11_ollama
          docker run -d --name phase11-qdrant             -p 6333:6333             -v phase11_qdrant:/qdrant/storage             qdrant/qdrant:v1.19.1
          docker run -d --name phase11-ollama             -p 11434:11434             -e OLLAMA_NUM_PARALLEL=1             -v phase11_ollama:/root/.ollama             ollama/ollama:0.34.0

      - name: Wait for exact runtime versions
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6333/ >/tmp/qdrant.json &&                curl -fsS http://127.0.0.1:11434/api/version >/tmp/ollama.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/qdrant.json
          cat /tmp/ollama.json
          python - <<'PY'
          import json
          q = json.load(open("/tmp/qdrant.json", encoding="utf-8"))
          o = json.load(open("/tmp/ollama.json", encoding="utf-8"))
          assert q["version"] == "1.19.1", q
          assert o["version"] == "0.34.0", o
          PY

      - name: Pull pinned embedding model
        shell: bash
        run: |
          curl --fail --show-error --silent             --max-time 1200             -H 'Content-Type: application/json'             -X POST http://127.0.0.1:11434/api/pull             -d '{"model":"qwen3-embedding:0.6b","stream":false}'             >/tmp/pull.json
          cat /tmp/pull.json
          grep -q '"status":"success"' /tmp/pull.json

      - name: Index and query through real services
        run: python integration/phase11_services.py --mode index

      - name: Restart Qdrant with persistent volume
        shell: bash
        run: |
          docker restart phase11-qdrant
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6333/ >/tmp/qdrant-after.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/qdrant-after.json

      - name: Query persisted vectors after restart
        run: python integration/phase11_services.py --mode query

      - name: Service logs on failure
        if: failure()
        shell: bash
        run: |
          docker logs phase11-qdrant || true
          docker logs phase11-ollama || true

      - name: Cleanup services
        if: always()
        shell: bash
        run: |
          docker rm -f phase11-qdrant phase11-ollama || true
          docker volume rm phase11_qdrant phase11_ollama || true
