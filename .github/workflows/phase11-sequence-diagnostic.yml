name: Phase 11 Sequence Diagnostic

on:
  push:
    branches:
      - work/phase-11-concrete-runtime-index

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-11-concrete-runtime-index
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Print competing static symbols
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          EXCLUDED={".git",".workflow",".idea",".vscode",".venv","venv","node_modules","dist","build","coverage","vendor","__pycache__"}
          names={"ensure_collection","upsert_chunks","query_chunks"}
          for path in sorted(Path(".").rglob("*.py")):
              if any(part in EXCLUDED for part in path.parts):
                  continue
              try:
                  tree=ast.parse(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              stack=[]
              class V(ast.NodeVisitor):
                  def visit_ClassDef(self,node):
                      stack.append(node.name); self.generic_visit(node); stack.pop()
                  def visit_FunctionDef(self,node):
                      if node.name in names:
                          print(f"DEF {node.name} {path.as_posix()}::{'.'.join(stack+[node.name])}")
                      stack.append(node.name); self.generic_visit(node); stack.pop()
                  visit_AsyncFunctionDef=visit_FunctionDef
                  def visit_Call(self,node):
                      def call_name(n):
                          if isinstance(n,ast.Name): return n.id
                          if isinstance(n,ast.Attribute):
                              left=call_name(n.value)
                              return f"{left}.{n.attr}" if left else n.attr
                          return ""
                      name=call_name(node.func)
                      if name and name.split(".")[-1] in names:
                          print(f"CALL {name} {path.as_posix()}:{getattr(node,'lineno',0)}")
                      self.generic_visit(node)
              V().visit(tree)
          PY
      - name: Print generated actual edges
        shell: bash
        run: |
          python .workflow/tools/generate_sequence_actual.py \
            --output-json /tmp/index.actual.json \
            --output-mermaid /tmp/index.actual.mmd \
            --entry src/max_grounding/persistent.py::index_documents
          python - <<'PY'
          import json
          g=json.load(open("/tmp/index.actual.json",encoding="utf-8"))
          for edge in g.get("edges",[]):
              if "persistent.py::index_documents" in edge.get("from","") or "ensure_collection" in edge.get("to","") or "upsert_chunks" in edge.get("to",""):
                  print("EDGE",json.dumps(edge,sort_keys=True))
          PY
