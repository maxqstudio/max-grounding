name: Phase 11 Truth Sync V2

on:
  push:
    branches:
      - work/phase-11-concrete-runtime-index

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-11-concrete-runtime-index
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Source regression
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m compileall -q src tests integration .workflow/tools

      - name: Apply semantic candidate truth
        run: python .github/phase11_truth_sync.py

      - name: Remove temporary automation before sequence digest
        run: |
          rm -f .github/phase11_truth_sync.py
          rm -f .github/workflows/phase11-truth-sync-v2.yml

      - name: Generate Phase 11 ACTUAL graphs
        run: |
          python .workflow/tools/generate_sequence_actual.py --output-json docs/sequence/generated/phase-11-persistent-index.actual.json --output-mermaid docs/sequence/generated/phase-11-persistent-index.actual.mmd --entry src/max_grounding/persistent.py::index_documents
          python .workflow/tools/generate_sequence_actual.py --output-json docs/sequence/generated/phase-11-persistent-query.actual.json --output-mermaid docs/sequence/generated/phase-11-persistent-query.actual.mmd --entry src/max_grounding/persistent.py::retrieve_persistent_semantic

      - name: Bind and validate both ACTUAL graphs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          names = ("phase-11-persistent-index", "phase-11-persistent-query")
          for name in names:
              actual_path = Path("docs/sequence/generated") / (name + ".actual.json")
              session_path = Path("docs/sequence/sessions") / (name + ".json")
              actual = json.loads(actual_path.read_text(encoding="utf-8"))
              session = json.loads(session_path.read_text(encoding="utf-8"))
              session["actual"]["source_digest"] = actual["source_digest"]
              session_path.write_text(json.dumps(session, indent=2) + "\n", encoding="utf-8")
          PY
          python .workflow/tools/validate_sequence_contract.py --session docs/sequence/sessions/phase-11-persistent-index.json
          python .workflow/tools/validate_sequence_contract.py --session docs/sequence/sessions/phase-11-persistent-query.json

      - name: Synchronize Project Truth
        run: python .workflow/tools/sync_project_truth.py

      - name: Verify generated Phase 11 truth
        run: |
          grep -q 'Current roadmap phase: PHASE_11_CONCRETE_RUNTIME_INDEX' docs/ROADMAP.md
          grep -q 'ROADMAP_SYNC: PASS' docs/ROADMAP.md
          grep -q 'qwen3-embedding:0.6b' docs/ARCHITECTURE.md
          grep -q 'Qdrant 1.19.1' docs/ARCHITECTURE.md

      - name: Commit final candidate truth
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow docs README.md .github
          git commit -m 'docs: sync phase 11 candidate truth'

      - name: Validate final clean STRICT candidate
        run: |
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_cross_document_consistency.py --base 15bff377b920e6cf7e9198af554b8f7dc31f2119 --require-base
          python .workflow/tools/validate_project_truth.py
          test -z "$(git status --porcelain)"

      - name: Verify tested product source unchanged
        run: git diff --exit-code b20322e074755960b29a4504c95e08a35946c6e2..HEAD -- src tests integration

      - name: Push validated truth
        run: git push origin HEAD:work/phase-11-concrete-runtime-index
