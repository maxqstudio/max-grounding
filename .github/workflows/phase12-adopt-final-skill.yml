name: Adopt Final Skill Workflow

on:
  push:
    branches:
      - work/phase-12-production-api-mcp

permissions:
  contents: write

jobs:
  adopt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 12 candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-12-production-api-mcp
          fetch-depth: 0

      - name: Checkout latest Skill Workflow
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: maxqstudio/Skill_Workflow
          ref: 024e2ea458b25ad9dfb401d3fdeaa994a4cbe1b8
          path: .skill-workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Vendor exact latest governance tool pack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path(".skill-workflow/scripts")
          target = Path(".workflow/tools")
          excluded = {"initialize_project_truth.py", "selftest_project_truth_compiler.py"}
          expected = []
          target.mkdir(parents=True, exist_ok=True)
          for src in sorted(source.glob("*.py")):
              if src.name in excluded:
                  continue
              shutil.copyfile(src, target / src.name)
              expected.append(src.name)
          for dst in sorted(target.glob("*.py")):
              if dst.name not in expected:
                  dst.unlink()
          print("VENDORED_TOOLS=" + str(len(expected)))
          PY
          for f in .workflow/tools/*.py; do
            cmp "$f" ".skill-workflow/scripts/$(basename "$f")"
          done
          echo SKILL_TOOLPACK_EXACT=PASS

      - name: Run latest Skill Workflow self-test
        run: python .skill-workflow/scripts/selftest_strict_project_workflow.py

      - name: Pin latest authority and harden permanent Acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          SKILL_SHA = "024e2ea458b25ad9dfb401d3fdeaa994a4cbe1b8"
          MAIN_BASE = "886ea1b363694d0f947362ab5b6745e2d768ab0f"

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, value):
              Path(path).write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")

          authority = load(".workflow/authority.json")
          skill = next(x for x in authority["authorities"] if x["concern"] == "skill_workflow")
          skill["authority"] = "maxqstudio/Skill_Workflow@" + SKILL_SHA
          skill["meaning"] = (
              "Pinned latest governance tooling including Python class-method "
              "path-symbol validation and Phase 12 route-predecessor support."
          )
          save(".workflow/authority.json", authority)

          state = load(".workflow/state.json")
          state["last_accepted_sha"] = MAIN_BASE
          state["last_accepted_branch"] = "main"
          state["status"] = "CANDIDATE_PENDING_GITHUB_ACTIONS"
          state["working_branch"] = "work/phase-12-production-api-mcp"

          current_line = "Skill Workflow authority is maxqstudio/Skill_Workflow@440bcc6b750f7338738903b04a8eb7ac59b6630e with ROADMAP_SYNC enforced."
          replacement = (
              "Skill Workflow authority is maxqstudio/Skill_Workflow@" + SKILL_SHA
              + " with ROADMAP_SYNC and Python class-method path-symbol validation enforced."
          )
          state["proven"] = [
              replacement if item == current_line else item
              for item in state["proven"]
              if "Skill Workflow 440bcc6b750f7338738903b04a8eb7ac59b6630e is the current governance authority" not in item
          ]
          proof = (
              "Skill Workflow class-method path-symbol validator repair PR #4 passed "
              "Governance Selftest on Ubuntu and Windows, merged as " + SKILL_SHA
              + ", passed post-merge main self-test, and is adopted by Phase 12."
          )
          if proof not in state["proven"]:
              state["proven"].append(proof)
          state["next_authorized_actions"] = [
              "Run permanent exact-head pull-request Acceptance using the latest Skill Workflow authority.",
              "Merge Phase 12 only if all permanent required jobs pass on the exact pull-request head.",
              "Revalidate merged main before accepting Production V1 and closing Phase 12."
          ]
          save(".workflow/state.json", state)

          changelog = load(".workflow/changelog.json")
          marker = "Phase 12 adopted final Skill Workflow " + SKILL_SHA
          if not any(item.get("change", "").startswith(marker) for item in changelog["entries"]):
              changelog["entries"].append({
                  "date": "2026-09-30",
                  "change": marker + " with Python class-method path-symbol validation; permanent Acceptance was upgraded to install service/test dependencies and self-test the same authority."
              })
          save(".workflow/changelog.json", changelog)

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          text = text.replace(
              "name: Core ${{ matrix.os }} py${{ matrix.python }}",
              "name: Service ${{ matrix.os }} py${{ matrix.python }}"
          )
          text = text.replace(
              "run: python -m pip install .",
              "run: python -m pip install '.[service,test]'"
          )
          text = text.replace(
              "run: python -m compileall -q src tests .workflow/tools",
              "run: python -m compileall -q src tests integration .workflow/tools"
          )
          text = text.replace(
              "ref: 9e22feddb8f94e8c0f1af6a33e14b64de5068f8f",
              "ref: " + SKILL_SHA
          )
          text = text.replace(
              "ref: 440bcc6b750f7338738903b04a8eb7ac59b6630e",
              "ref: " + SKILL_SHA
          )
          ci.write_text(text, encoding="utf-8")
          PY

      - name: Run Phase 12 source regression with service dependencies
        shell: bash
        run: |
          python -m pip install '.[service,test]'
          python -m unittest discover -s tests -v
          python -m compileall -q src tests integration .workflow/tools

      - name: Remove one-shot workflow before final truth snapshot
        shell: bash
        run: |
          rm -rf .skill-workflow
          rm -f .github/workflows/phase12-adopt-final-skill.yml
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "ci.yml"

      - name: Synchronize Project Truth with final snapshot
        run: python .workflow/tools/sync_project_truth.py

      - name: Verify final authority
        shell: bash
        run: |
          grep -q 'maxqstudio/Skill_Workflow@024e2ea458b25ad9dfb401d3fdeaa994a4cbe1b8' .workflow/authority.json
          grep -q 'ROADMAP_SYNC: PASS' docs/ROADMAP.md
          grep -q 'Current roadmap phase: PHASE_12_PRODUCTION_API_MCP' docs/ROADMAP.md
          grep -q "python -m pip install '.\[service,test\]'" .github/workflows/ci.yml
          grep -q '024e2ea458b25ad9dfb401d3fdeaa994a4cbe1b8' .github/workflows/ci.yml

      - name: Commit final adopted snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow docs README.md .github/workflows
          git commit -m 'chore: adopt final Skill Workflow authority'

      - name: Require clean worktree before validators
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Validate latest STRICT governance
        shell: bash
        run: |
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_cross_document_consistency.py --base 886ea1b363694d0f947362ab5b6745e2d768ab0f --require-base
          python .workflow/tools/validate_project_truth.py
          test -z "$(git status --porcelain)"

      - name: Prove product source unchanged
        shell: bash
        run: |
          git diff --exit-code cc347a91af52c091187a5762a9f64bd7b3d55034 HEAD -- src tests integration Dockerfile .dockerignore pyproject.toml

      - name: Push final Phase 12 candidate
        run: git push origin HEAD:work/phase-12-production-api-mcp
