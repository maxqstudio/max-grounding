name: Phase 12 Candidate Verify

on:
  push:
    branches:
      - work/phase-12-production-api-mcp

permissions:
  contents: read

jobs:
  sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-12-production-api-mcp
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install '.[service,test]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests integration .workflow/tools

      - name: Generate production-runtime ACTUAL
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --output-json docs/sequence/generated/phase-12-production-runtime.actual.json
          --output-mermaid docs/sequence/generated/phase-12-production-runtime.actual.mmd
          --entry src/max_grounding/service.py::build_production_runtime
          --entry src/max_grounding/service.py::GroundingService.search_web
          --entry src/max_grounding/service.py::GroundingService.fetch_evidence
          --entry src/max_grounding/service.py::GroundingService.index_evidence
          --entry src/max_grounding/service.py::GroundingService.query_evidence

      - name: Generate REST ACTUAL
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --output-json docs/sequence/generated/phase-12-rest-api.actual.json
          --output-mermaid docs/sequence/generated/phase-12-rest-api.actual.mmd
          --entry src/max_grounding/api.py::healthz
          --entry src/max_grounding/api.py::readyz
          --entry src/max_grounding/api.py::search_endpoint
          --entry src/max_grounding/api.py::fetch_endpoint
          --entry src/max_grounding/api.py::index_endpoint
          --entry src/max_grounding/api.py::query_endpoint

      - name: Generate MCP ACTUAL
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --output-json docs/sequence/generated/phase-12-mcp-server.actual.json
          --output-mermaid docs/sequence/generated/phase-12-mcp-server.actual.mmd
          --entry src/max_grounding/mcp_server.py::create_mcp_server
          --entry src/max_grounding/mcp_server.py::mcp_search_web
          --entry src/max_grounding/mcp_server.py::mcp_fetch_evidence
          --entry src/max_grounding/mcp_server.py::mcp_index_evidence
          --entry src/max_grounding/mcp_server.py::mcp_query_evidence

      - run: python .workflow/tools/validate_sequence_contract.py --session docs/sequence/sessions/phase-12-production-runtime.json
      - run: python .workflow/tools/validate_sequence_contract.py --session docs/sequence/sessions/phase-12-rest-api.json
      - run: python .workflow/tools/validate_sequence_contract.py --session docs/sequence/sessions/phase-12-mcp-server.json

  cross-platform:
    name: Service ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-12-production-api-mcp
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[service,test]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests integration .workflow/tools
