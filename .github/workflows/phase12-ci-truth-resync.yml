name: Phase 12 CI Truth Resync

on:
  push:
    branches:
      - work/phase-12-production-api-mcp

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-12-production-api-mcp
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Record permanent Acceptance repair
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(".workflow/changelog.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          marker = "Permanent Acceptance aligned with Phase 12 service dependencies"
          if not any(item.get("change","").startswith(marker) for item in data["entries"]):
              data["entries"].append({
                  "date":"2026-09-30",
                  "change":"Permanent Acceptance aligned with Phase 12 service dependencies, integration compilation, and Skill Workflow 440bcc6b750f7338738903b04a8eb7ac59b6630e after PR acceptance exposed stale core-only installation and an obsolete governance pin."
              })
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Remove one-shot workflow before compiler snapshot
        run: rm -f .github/workflows/phase12-ci-truth-resync.yml

      - name: Synchronize Project Truth
        run: python .workflow/tools/sync_project_truth.py

      - name: Commit clean synchronized snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow docs .github/workflows
          git commit -m 'docs: resync phase 12 permanent acceptance truth'

      - name: Validate latest STRICT governance
        shell: bash
        run: |
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_cross_document_consistency.py --base 886ea1b363694d0f947362ab5b6745e2d768ab0f --require-base
          python .workflow/tools/validate_project_truth.py
          test -z "$(git status --porcelain)"

      - name: Prove product source unchanged
        shell: bash
        run: |
          git diff --exit-code cc347a91af52c091187a5762a9f64bd7b3d55034 HEAD -- \
            src tests integration Dockerfile .dockerignore pyproject.toml

      - name: Push clean synchronized candidate
        run: git push origin HEAD:work/phase-12-production-api-mcp
