name: Phase 12 Closure Doc Sync

on:
  push:
    branches:
      - work/phase-12-closure

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-12-closure
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Generate closure truth without helper
        shell: bash
        run: |
          rm .github/workflows/phase12-closure-doc-sync.yml
          python .workflow/tools/sync_project_truth.py
      - name: Restore helper only for permitted push
        run: git checkout HEAD -- .github/workflows/phase12-closure-doc-sync.yml
      - name: Commit deterministic closure truth
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow/acceptance.json .workflow/generated docs
          if git diff --cached --quiet; then
            echo 'No generated closure changes.'
          else
            git commit -m 'docs: sync Production V1 closure truth'
          fi
      - name: Push closure truth
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]; then
            echo 'Nothing to push.'
          else
            git push origin HEAD:work/phase-12-closure
          fi
