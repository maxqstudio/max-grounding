name: Phase 12 GREEN

on:
  push:
    branches:
      - work/phase-12-production-api-mcp

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-12-production-api-mcp
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install '.[service,test]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests integration .workflow/tools
