name: Phase 12 Production Acceptance

on:
  push:
    branches:
      - work/phase-12-production-api-mcp

permissions:
  contents: read

jobs:
  real-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-12-production-api-mcp

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install service and E2E dependencies
        run: python -m pip install '.[service,test]'

      - name: Build native production image
        run: docker build --pull -t max-grounding:phase12 .

      - name: Verify container security contract
        shell: bash
        run: |
          test "$(docker image inspect max-grounding:phase12 --format '{{.Config.User}}')" = "maxgrounding"
          docker image inspect max-grounding:phase12 --format '{{json .Config.Healthcheck}}'
          docker image inspect max-grounding:phase12 --format 'IMAGE_ID={{.Id}}'

      - name: Pull pinned Phase 11 service images
        shell: bash
        run: |
          docker pull qdrant/qdrant:v1.19.1
          docker pull ollama/ollama:0.34.0
          docker image inspect qdrant/qdrant:v1.19.1 --format 'QDRANT_IMAGE={{.Id}}'
          docker image inspect ollama/ollama:0.34.0 --format 'OLLAMA_IMAGE={{.Id}}'

      - name: Start pinned Qdrant and Ollama
        shell: bash
        run: |
          docker volume create phase12_qdrant
          docker volume create phase12_ollama
          docker run -d --name phase12-qdrant             -p 6333:6333             -v phase12_qdrant:/qdrant/storage             qdrant/qdrant:v1.19.1
          docker run -d --name phase12-ollama             -p 11434:11434             -e OLLAMA_NUM_PARALLEL=1             -v phase12_ollama:/root/.ollama             ollama/ollama:0.34.0

      - name: Wait for exact dependency versions
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:6333/ >/tmp/qdrant.json &&                curl -fsS http://127.0.0.1:11434/api/version >/tmp/ollama.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/qdrant.json
          cat /tmp/ollama.json
          python - <<'PY'
          import json
          q = json.load(open("/tmp/qdrant.json", encoding="utf-8"))
          o = json.load(open("/tmp/ollama.json", encoding="utf-8"))
          assert q["version"] == "1.19.1", q
          assert o["version"] == "0.34.0", o
          PY

      - name: Pull pinned embedding model
        shell: bash
        run: |
          curl --fail --show-error --silent             --max-time 1200             -H 'Content-Type: application/json'             -X POST http://127.0.0.1:11434/api/pull             -d '{"model":"qwen3-embedding:0.6b","stream":false}'             >/tmp/pull.json
          cat /tmp/pull.json
          grep -q '"status":"success"' /tmp/pull.json

      - name: Start production MAX Grounding container
        shell: bash
        run: |
          docker run -d --name phase12-grounding             --network host             -e MAX_GROUNDING_SEARXNG_URL=http://127.0.0.1:18080             -e MAX_GROUNDING_OLLAMA_URL=http://127.0.0.1:11434             -e MAX_GROUNDING_QDRANT_URL=http://127.0.0.1:6333             -e MAX_GROUNDING_API_KEY=phase12-production-acceptance-key-0001             -e 'MAX_GROUNDING_ALLOWED_HOSTS=127.0.0.1:*,localhost:*'             max-grounding:phase12
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          docker inspect phase12-grounding --format 'APP_CONTAINER={{.State.Status}}'

      - name: Run real REST MCP security and bounded-load probe
        run: >
          python integration/phase12_e2e.py
          --base-url http://127.0.0.1:8080
          --ollama-url http://127.0.0.1:11434
          --qdrant-url http://127.0.0.1:6333
          --search-port 18080

      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          docker logs phase12-grounding || true
          docker logs phase12-qdrant || true
          docker logs phase12-ollama || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f phase12-grounding phase12-qdrant phase12-ollama || true
          docker volume rm phase12_qdrant phase12_ollama || true

  multiarch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-12-production-api-mcp

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build multi-arch OCI image
        shell: bash
        run: |
          docker buildx build             --pull             --platform linux/amd64,linux/arm64             --output type=oci,dest=/tmp/max-grounding-phase12.oci             .
          ls -lh /tmp/max-grounding-phase12.oci
          sha256sum /tmp/max-grounding-phase12.oci
