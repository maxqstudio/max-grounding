name: Phase 3 Cross Platform

on:
  push:
    branches:
      - work/phase-03-secure-fetch

permissions:
  contents: read

jobs:
  cross-platform:
    name: Core ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-03-secure-fetch
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Compile tracked Python
        run: python -m compileall -q src tests .workflow/tools
