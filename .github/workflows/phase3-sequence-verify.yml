name: Phase 3 Sequence Verify

on:
  push:
    branches:
      - work/phase-03-secure-fetch

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-03-secure-fetch
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install .
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Compile tracked Python
        run: python -m compileall -q src tests .workflow/tools
      - name: Generate actual sequence
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --output-json docs/sequence/generated/phase-03-secure-fetch.actual.json
          --output-mermaid docs/sequence/generated/phase-03-secure-fetch.actual.mmd
          --entry src/max_grounding/fetcher.py::fetch_document
      - name: Validate frozen plan against actual
        run: >
          python .workflow/tools/validate_sequence_contract.py
          --session docs/sequence/sessions/phase-03-secure-fetch.json
