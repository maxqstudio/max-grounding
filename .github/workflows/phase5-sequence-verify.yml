name: Phase 5 Sequence Verify

on:
  push:
    branches:
      - work/phase-05-semantic-retrieval

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-05-semantic-retrieval
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install .
      - name: Source tests and compile
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src tests .workflow/tools
      - name: Generate actual sequence
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --output-json docs/sequence/generated/phase-05-semantic-retrieval.actual.json
          --output-mermaid docs/sequence/generated/phase-05-semantic-retrieval.actual.mmd
          --entry src/max_grounding/semantic.py::retrieve_semantic
      - name: Validate frozen plan against actual
        run: >
          python .workflow/tools/validate_sequence_contract.py
          --session docs/sequence/sessions/phase-05-semantic-retrieval.json
