name: Phase 6 Roadmap Truth Sync

on:
  push:
    branches:
      - work/phase-06-hybrid-fusion

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/phase-06-hybrid-fusion
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Source tests
        shell: bash
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m compileall -q src tests .workflow/tools
      - name: Synchronize Project Truth
        run: python .workflow/tools/sync_project_truth.py
      - name: Require generated roadmap
        shell: bash
        run: |
          test -f docs/ROADMAP.md
          grep -q 'Phase 12' docs/ROADMAP.md
          grep -q 'REST, MCP' docs/ROADMAP.md
      - name: Precommit deterministic truth
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow/acceptance.json .workflow/generated docs
          if git diff --cached --quiet; then
            echo 'No truth changes.'
          else
            git commit -m 'docs: sync phase 6 roadmap and project truth'
          fi
      - name: Validate strict project truth on clean tree
        shell: bash
        run: |
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_sequence_sessions.py
          BASE=$(git merge-base HEAD origin/main)
          python .workflow/tools/validate_cross_document_consistency.py --base "$BASE" --require-base
          python .workflow/tools/validate_project_truth.py
          test -z "$(git status --porcelain)"
      - name: Push validated truth
        shell: bash
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]; then
            echo 'Nothing to push.'
          else
            git push origin HEAD:work/phase-06-hybrid-fusion
          fi
