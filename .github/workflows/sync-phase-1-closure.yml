name: Sync Phase 1 Closure Docs

on:
  push:
    branches:
      - work/phase-01-closure

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/phase-01-closure
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Generate deterministic project docs
        run: python .workflow/tools/generate_project_docs.py
      - name: Commit generated docs
        shell: bash
        run: |
          if git diff --quiet -- docs; then
            echo "Generated docs already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: generate phase 1 closure state"
          git push origin HEAD:work/phase-01-closure
