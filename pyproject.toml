[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "max-grounding"
dynamic = ["version"]
description = "Self-hostable evidence-first grounding engine for LLMs and agents."
requires-python = ">=3.11"
readme = "README.md"
authors = [{name = "maxqstudio"}]
keywords = ["grounding", "rag", "mcp", "retrieval", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
service = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "mcp==2.2.0",
]
test = [
  "httpx==0.28.1",
]

[project.urls]
Repository = "https://github.com/maxqstudio/max-grounding"
Saweria = "https://saweria.co/maxq"
PayPal = "https://paypal.me/JacksonJackson1501"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "max_grounding.__version__"}
